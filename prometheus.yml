services:
  prometheus:
    image: kayyum/ubuntu-minimal:latest
    container_name: prometheus
    hostname: prometheus 
    tty: true
    restart: unless-stopped
    ports:
      - "9090:9090"
      - "2224:22"
    command: >
      bash -c '
      apt-get update -y && 
      apt-get install -y iputils-ping vim curl wget net-tools openssh-server software-properties-common && 
      id -u kayyum >/dev/null 2>&1 || useradd -m -s /bin/bash kayyum && 
      echo "kayyum:k" | chpasswd && 
      mkdir -p /var/run/sshd && 
      service ssh start && 
      
      id -u prometheus >/dev/null 2>&1 || useradd --no-create-home --shell /bin/false prometheus &&
      mkdir -p /etc/prometheus /var/lib/prometheus &&
      
      cd /tmp &&
      curl -LO https://github.com/prometheus/prometheus/releases/download/v2.51.0/prometheus-2.51.0.linux-amd64.tar.gz &&
      tar -xvf prometheus-2.51.0.linux-amd64.tar.gz &&
      cd prometheus-2.51.0.linux-amd64 &&
      
      cp prometheus promtool /usr/local/bin/ &&
      cp -r consoles console_libraries /etc/prometheus/ &&
      cp prometheus.yml /etc/prometheus/prometheus.yml &&
      
      chown -R prometheus:prometheus /etc/prometheus /var/lib/prometheus &&
      chown prometheus:prometheus /usr/local/bin/prometheus /usr/local/bin/promtool &&
      
      /usr/local/bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/var/lib/prometheus/
      '

#      add below in /etc/prometheus/prometheus.yml file 
