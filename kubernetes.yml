services:
  kubernetes:
    image: kayyum/ubuntu-minimal:latest
    container_name: kubernetes
    hostname: kubernetes
    tty: true
    stdin_open: true
    volumes:
      # Mount the host Docker socket so the container can talk to the host daemon
      - /var/run/docker.sock:/var/run/docker.sock
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    command: >
      bash -c "
      apt-get update -y && 
      apt-get install -y sudo iputils-ping vim curl wget net-tools openssh-server software-properties-common ca-certificates gnupg python-is-python3 && 
      install -m 0755 -d /etc/apt/keyrings && 
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg && 
      chmod a+r /etc/apt/keyrings/docker.gpg && 
      echo \"deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \$(. /etc/os-release && echo \$$VERSION_CODENAME) stable\" | tee /etc/apt/sources.list.d/docker.list > /dev/null && 
      apt-get update -y && 
      apt-get install -y docker-ce-cli docker-compose-plugin && 
      useradd -m -s /bin/bash kayyum && 
      echo 'kayyum:k' | chpasswd && 
      echo 'kayyum ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers && 
      mkdir -p /var/run/sshd && 
      service ssh start && 
      tail -f /dev/null
      "