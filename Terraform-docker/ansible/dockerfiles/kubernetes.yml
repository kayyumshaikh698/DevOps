FROM ubuntu:noble-20260911

ENV DEBIAN_FRONTEND=noninteractive

# Install dependencies, Docker CLI, and utilities
RUN apt-get update -y && \
    apt-get install -y \
    sudo \
    iputils-ping \
    vim \
    curl \
    wget \
    net-tools \
    openssh-server \
    software-properties-common \
    ca-certificates \
    gnupg \
    python-is-python3 && \
    install -m 0755 -d /etc/apt/keyrings && \
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg && \
    chmod a+r /etc/apt/keyrings/docker.gpg && \
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null && \
    apt-get update -y && \
    apt-get install -y docker-ce-cli docker-compose-plugin && \
    rm -rf /var/lib/apt/lists/*

# Install kubectl
RUN curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && \
    install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl && \
    rm kubectl

# Install Kind (Kubernetes in Docker)
RUN curl -Lo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64 && \
    chmod +x /usr/local/bin/kind
    
RUN echo "jenkins ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/jenkins-policy && \
    chmod 440 /etc/sudoers.d/jenkins-policy
# Configure user 'kayyum' and SSH
RUN useradd -m -s /bin/bash kayyum && \
    echo 'kayyum:k' | chpasswd && \
    echo 'kayyum ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers && \
    mkdir -p /var/run/sshd


EXPOSE 22

# Start SSH service and keep the container running
CMD service ssh start && tail -f /dev/null