FROM ubuntu:noble-20260911

ENV DEBIAN_FRONTEND=noninteractive
ENV TZ=Asia/Kolkata

RUN apt-get clean && \
    rm -f /etc/apt/sources.list && \
    rm -rf /var/lib/apt/lists/* && \
    echo "deb http://archive.ubuntu.com/ubuntu/ noble main restricted universe multiverse" > /etc/apt/sources.list && \
    echo "deb http://archive.ubuntu.com/ubuntu/ noble-updates main restricted universe multiverse" >> /etc/apt/sources.list && \
    echo "deb http://security.ubuntu.com/ubuntu/ noble-security main restricted universe multiverse" >> /etc/apt/sources.list && \
    apt-get update -y && \
    apt-get install -y --no-install-recommends \
        ca-certificates iputils-ping vim curl wget net-tools openssh-server \
        python3 sshpass python-is-python3 sudo postgresql python3-psycopg2 postgresql-contrib libpq-dev && \
    rm -rf /var/lib/apt/lists/*

# Setup system users and policies
RUN id -u kayyum >/dev/null 2>&1 || useradd -m -s /bin/bash kayyum && \
    id -u jenkins >/dev/null 2>&1 || useradd -m -s /bin/bash jenkins && \
    id -u postgres >/dev/null 2>&1 || useradd -m -s /bin/bash postgres && \
    echo "kayyum:k" | chpasswd && \
    echo "jenkins:k" | chpasswd && \
    echo "postgres:k" | chpasswd && \
    echo "postgres ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/postgres-policy && \
    chmod 440 /etc/sudoers.d/postgres-policy && \
    mkdir -p /var/run/sshd

EXPOSE 5432 22