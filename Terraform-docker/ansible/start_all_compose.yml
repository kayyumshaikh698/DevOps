services:
  ansible:
    build:
      context: .
      dockerfile: /dockerfiles/ansible.yml
    image: kayyum/kayyum_ansible:latest 
    container_name: ansible
    hostname: ansible 
    networks:
      app_net:
        ipv4_address: 172.28.0.20
    tty: true
    restart: unless-stopped
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - TZ=Asia/Kolkata 
    volumes:
      - ansible_data:/var/lib/ansible
    ports:
      - "2223:22" # Optional: map SSH port to host if needed
    command: >
      bash -c '
      mkdir -p /var/lib/ansible/kayyum &&
      id -u kayyum >/dev/null 2>&1 && usermod -d /var/lib/ansible/kayyum -m kayyum || true &&
      chown -R kayyum:kayyum /var/lib/ansible/kayyum &&
      service ssh start && 
      tail -f /dev/null
      '
  postgres:
    build:
      context: .
      dockerfile: /dockerfiles/postgres.yml
    image: kayyum/kayyum_postgres:latest 
    container_name: postgres
    hostname: postgres 
    networks:
      app_net:
        ipv4_address: 172.28.0.10
    tty: true
    restart: unless-stopped
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - TZ=Asia/Kolkata 
    ports:
      - "5432:5432"
      - "2222:22"
      - "8000:8000"
    volumes:
      - postgres_data:/var/lib/postgresql
    command: >
      bash -c '
      service ssh start && 
      service postgresql start && 
      if ! grep -q "listen_addresses" /etc/postgresql/16/main/postgresql.conf; then
        echo "listen_addresses = '\''*'\''" >> /etc/postgresql/16/main/postgresql.conf
        echo "host all all 0.0.0.0/0 scram-sha-256" >> /etc/postgresql/16/main/pg_hba.conf
        service postgresql restart
      fi && 
      tail -f /dev/null
      '
  jenkins:
    build:
      context: .
      dockerfile: /dockerfiles/jenkins.yml
    image: kayyum/kayyum_jenkins:latest 
    container_name: jenkins
    hostname: jenkins
    networks:
      app_net:
        ipv4_address: 172.28.0.30
    restart: on-failure
    user: root 
    ports:
      - "8080:8080"
      - "50000:50000"
      - "2224:22"
    environment:
      JAVA_HOME: /opt/java/openjdk
      PATH: /opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - jenkins_home:/var/jenkins_home
    command: >
      bash -c '
      chown -R jenkins:jenkins /var/jenkins_home &&
      chmod 755 /var/jenkins_home &&
      service ssh start && 
      su -p jenkins -c "/usr/bin/tini -s -- /usr/local/bin/jenkins.sh"
      '

volumes:
  jenkins_home:
  postgres_data:
  ansible_data:

networks:
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

